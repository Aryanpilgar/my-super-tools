<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All-in-One Super Tools</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: #fff; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); width: 100%; max-width: 450px; text-align: center; }
        h1 { color: #4a148c; margin-bottom: 20px; font-size: 24px; }
        .tab-btn { background: #eee; border: none; padding: 10px 20px; cursor: pointer; border-radius: 10px; font-weight: bold; margin: 5px; transition: 0.3s; }
        .tab-btn.active { background: #764ba2; color: #fff; }
        .tool-section { display: none; margin-top: 20px; }
        .tool-section.active { display: block; }
        input { width: 100%; padding: 12px; margin: 15px 0; border: 2px solid #ddd; border-radius: 10px; font-size: 16px; outline: none; }
        button.action-btn { width: 100%; background: #764ba2; color: white; border: none; padding: 12px; border-radius: 10px; font-size: 16px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button.action-btn:hover { background: #5a3284; }
        .result { margin-top: 20px; font-size: 18px; font-weight: bold; color: #4a148c; }
        #qrcode img { margin: 20px auto; display: block; }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 Super Tool Web</h1>
    <div>
        <button class="tab-btn active" onclick="switchTool('age')">Age Calculator</button>
        <button class="tab-btn" onclick="switchTool('qr')">QR Generator</button>
    </div>

    <!-- Age Calculator -->
    <div id="age-tool" class="tool-section active">
        <p>अपनी जन्मतिथि चुनें:</p>
        <input type="date" id="dob">
        <button class="action-btn" onclick="calculateAge()">Calculate Age</button>
        <div class="result" id="age-result"></div>
    </div>

    <!-- QR Code Generator -->
    <div id="qr-tool" class="tool-section">
        <p>कोई भी टेक्स्ट या वेबसाइट लिंक डालें:</p>
        <input type="text" id="qr-text" placeholder="https://example.com">
        <button class="action-btn" onclick="generateQR()">Generate QR Code</button>
        <div id="qrcode"></div>
    </div>
</div>

<script src="https://cloudflare.com"></script>
<script>
    function switchTool(tool) {
        document.querySelectorAll('.tool-section').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        
        if(tool === 'age') {
            document.getElementById('age-tool').classList.add('active');
            event.target.classList.add('active');
        } else {
            document.getElementById('qr-tool').classList.add('active');
            event.target.classList.add('active');
        }
    }

    function calculateAge() {
        let dobInput = document.getElementById('dob').value;
        if(!dobInput) { alert('कृपया तारीख चुनें!'); return; }
        let dob = new Date(dobInput);
        let diff = Date.now() - dob.getTime();
        let ageDate = new Date(diff);
        let years = Math.abs(ageDate.getUTCFullYear() - 1970);
        document.getElementById('age-result').innerHTML = `आपकी उम्र ${years} वर्ष है! 🎉`;
    }

    function generateQR() {
        let qrText = document.getElementById('qr-text').value;
        let qrContainer = document.getElementById('qrcode');
        qrContainer.innerHTML = "";
        if(!qrText) { alert('कृपया कुछ टेक्स्ट या लिंक डालें!'); return; }
        new QRCode(qrContainer, { text: qrText, width: 128, height: 128 });
    }
</script>
</body>
</html>
